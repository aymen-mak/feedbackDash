<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slack User Sidebar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1b1e;
      color: #dcddde;
      height: 100vh;
      display: flex;
      align-items: stretch;
    }

    /* ── Sidebar container ───────────────────────────────────────────── */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1e1f22;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px 8px;
      border-bottom: 1px solid #1e1f22;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #949ba4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title .workspace-name {
      color: #f2f3f5;
      font-size: 13px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      margin-bottom: 4px;
      display: block;
    }

    .refresh-btn {
      background: none;
      border: none;
      color: #949ba4;
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .refresh-btn:hover { color: #dcddde; }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Scrollable member list ──────────────────────────────────────── */
    .member-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .member-list::-webkit-scrollbar { width: 4px; }
    .member-list::-webkit-scrollbar-track { background: transparent; }
    .member-list::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }

    /* ── Section headers (ONLINE / OFFLINE) ─────────────────────────── */
    .section-header {
      padding: 16px 8px 4px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #949ba4;
    }

    /* ── Individual member row ───────────────────────────────────────── */
    .member-row {
      display: flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 4px;
      margin: 0 4px;
      cursor: pointer;
      transition: background 0.1s;
      gap: 8px;
    }
    .member-row:hover { background: #35373c; }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #36393f;
    }

    .avatar-fallback {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── Presence dot ────────────────────────────────────────────────── */
    .presence-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #2b2d31;
    }
    .presence-dot.online  { background: #23a559; }
    .presence-dot.offline { background: transparent; border-color: #80848e; }
    .presence-dot.offline::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #2b2d31;
    }

    .member-info {
      min-width: 0;
      flex: 1;
    }

    .member-name {
      font-size: 14px;
      font-weight: 500;
      color: #f2f3f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .member-row.offline .member-name { color: #80848e; }

    .member-title {
      font-size: 11px;
      color: #80848e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-badge {
      font-size: 10px;
      background: #5865f2;
      color: #fff;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      font-weight: 600;
    }

    /* ── Empty / error / loading states ─────────────────────────────── */
    .state-msg {
      padding: 24px 16px;
      text-align: center;
      color: #80848e;
      font-size: 13px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #80848e;
      border-top-color: #dcddde;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }

    /* ── Right panel (demo workspace preview) ────────────────────────── */
    .main-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #949ba4;
      font-size: 14px;
    }

    .main-area svg { opacity: 0.3; }
    .main-area p { text-align: center; line-height: 1.6; max-width: 280px; }

    /* ── Tooltip on hover ────────────────────────────────────────────── */
    .member-row:hover .member-name { color: #fff; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <span class="workspace-name" id="workspace-name">Slack Workspace</span>
    <div class="sidebar-title">
      Members
      <button class="refresh-btn" id="refresh-btn" title="Refresh presence">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="member-list" id="member-list">
    <div class="state-msg">
      <div class="spinner"></div>
      <div>Loading members…</div>
    </div>
  </div>
</aside>

<main class="main-area">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <p>User sidebar loaded.<br/>Select a member from the list to start a DM.</p>
</main>

<script>
  const API_BASE = window.location.origin;
  const listEl = document.getElementById('member-list');
  const refreshBtn = document.getElementById('refresh-btn');
  const workspaceName = document.getElementById('workspace-name');

  // ── Helpers ─────────────────────────────────────────────────────────

  function initials(name) {
    return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function avatarEl(user) {
    if (user.avatar) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = user.avatar;
      img.alt = user.name;
      img.onerror = () => img.replaceWith(fallbackEl(user));
      return img;
    }
    return fallbackEl(user);
  }

  function fallbackEl(user) {
    const div = document.createElement('div');
    div.className = 'avatar-fallback';
    div.textContent = initials(user.name);
    return div;
  }

  // ── Render ───────────────────────────────────────────────────────────

  function renderMembers(users) {
    const online  = users.filter(u => u.presence === 'active');
    const offline = users.filter(u => u.presence !== 'active');

    listEl.innerHTML = '';

    if (users.length === 0) {
      listEl.innerHTML = '<div class="state-msg">No members found.</div>';
      return;
    }

    function renderSection(label, members, isOnline) {
      if (members.length === 0) return;
      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = `${label} — ${members.length}`;
      listEl.appendChild(header);

      members.forEach(user => {
        const row = document.createElement('div');
        row.className = 'member-row' + (isOnline ? '' : ' offline');
        row.title = user.real_name || user.name;

        // Avatar + presence dot
        const wrap = document.createElement('div');
        wrap.className = 'avatar-wrap';
        wrap.appendChild(avatarEl(user));

        const dot = document.createElement('div');
        dot.className = 'presence-dot ' + (isOnline ? 'online' : 'offline');
        wrap.appendChild(dot);

        // Name + title
        const info = document.createElement('div');
        info.className = 'member-info';

        const nameEl = document.createElement('div');
        nameEl.className = 'member-name';
        nameEl.textContent = user.name;

        info.appendChild(nameEl);

        if (user.title) {
          const titleEl = document.createElement('div');
          titleEl.className = 'member-title';
          titleEl.textContent = user.title;
          info.appendChild(titleEl);
        }

        row.appendChild(wrap);
        row.appendChild(info);

        if (user.is_admin || user.is_owner) {
          const badge = document.createElement('span');
          badge.className = 'admin-badge';
          badge.textContent = user.is_owner ? 'Owner' : 'Admin';
          row.appendChild(badge);
        }

        row.addEventListener('click', () => {
          console.log('Open DM with', user.id, user.name);
        });

        listEl.appendChild(row);
      });
    }

    renderSection('Online', online, true);
    renderSection('Offline', offline, false);
  }

  // ── Fetch ────────────────────────────────────────────────────────────

  async function loadUsers() {
    refreshBtn.classList.add('spinning');
    listEl.innerHTML = '<div class="state-msg"><div class="spinner"></div><div>Loading members…</div></div>';

    try {
      const res = await fetch(`${API_BASE}/api/users`);
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || 'Unknown error');

      renderMembers(data.users);
      workspaceName.textContent = 'Workspace Members';
    } catch (err) {
      listEl.innerHTML = `
        <div class="state-msg">
          <div style="color:#ed4245;margin-bottom:8px;">⚠ Failed to load</div>
          <div>${err.message}</div>
          <div style="margin-top:8px;font-size:11px;">Make sure SLACK_BOT_TOKEN is set in .env</div>
        </div>`;
    } finally {
      refreshBtn.classList.remove('spinning');
    }
  }

  // ── Auto-refresh presence every 60 s ────────────────────────────────
  let refreshTimer;

  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(loadUsers, 60_000);
  }

  refreshBtn.addEventListener('click', () => {
    clearTimeout(refreshTimer);
    loadUsers().then(scheduleRefresh);
  });

  // Initial load
  loadUsers().then(scheduleRefresh);
</script>
</body>
</html>
