<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="8" y1="20" x2="32" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Mask for ring 1: gap where ring 2 crosses over (bottom-left) -->
    <mask id="m1">
      <rect width="40" height="40" fill="white"/>
      <circle cx="14.4" cy="25.6" r="3.5" fill="black"/>
    </mask>
    <!-- Mask for ring 2: gap where ring 1 crosses over (top-right) -->
    <mask id="m2">
      <rect width="40" height="40" fill="white"/>
      <circle cx="25.6" cy="14.4" r="3.5" fill="black"/>
    </mask>
  </defs>
  <!-- Interlocking rings with weave effect -->
  <circle cx="17" cy="17" r="9" stroke="url(#grad)" stroke-width="2.5" fill="none" mask="url(#m1)"/>
  <circle cx="23" cy="23" r="9" stroke="url(#grad)" stroke-width="2.5" fill="none" mask="url(#m2)"/>
</svg>
