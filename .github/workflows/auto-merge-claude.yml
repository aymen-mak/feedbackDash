name: Auto-merge Claude branches to master

# Manual only. Auto-merging every claude/** push into master triggered a failing
# Vercel production build on each push and sent a deployment-failure email every
# time. Run this by hand from the Actions tab when you deliberately want to merge
# a branch to master.
on:
  workflow_dispatch:

jobs:
  merge-to-master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into master
        run: |
          if git rev-parse --verify origin/master >/dev/null 2>&1; then
            git checkout master
          else
            git checkout -b master origin/${{ github.ref_name }}
          fi
          git merge --ff-only origin/${{ github.ref_name }} || git merge -X theirs origin/${{ github.ref_name }}
          git push origin master
